name: word-assets-step2

on:
  push:
    branches:
      - docs/word-original-assets-step2b
    paths:
      - '.asset-upload/READY'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/word-original-assets-step2b

      - name: Rebuild exact Word route-rule PNG
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p images/word-originals/oci
          {
            cat .asset-upload/route8/part-000
            cat .asset-upload/route8/part-001
            cat .asset-upload/route8/part-002
            cat .asset-upload/route8/part-003
            cat .asset-upload/route8/part-004
            cat .asset-upload/route8fix/part-005a
            cat .asset-upload/route8fix/part-005b
            cat .asset-upload/route8/part-006
            cat .asset-upload/route8/part-007
            cat .asset-upload/route8/part-008
            cat .asset-upload/route8/part-009
            cat .asset-upload/route8fix/part-010a
            cat .asset-upload/route8fix/part-010b
            cat .asset-upload/route8/part-011
            cat .asset-upload/route8/part-012
          } | base64 -d > images/word-originals/oci/oci-route-rule.png
          test "$(stat -c %s images/word-originals/oci/oci-route-rule.png)" = "74799"
          echo '074b342fc455428dc0076092af4e5b304b0653f9fb249815ac18512c80513c08  images/word-originals/oci/oci-route-rule.png' | sha256sum -c -

      - name: Commit exact Word PNG and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .asset-upload .github/workflows/word-assets-step2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: add original Word OCI route-rule asset'
          git push origin HEAD:docs/word-original-assets-step2b
