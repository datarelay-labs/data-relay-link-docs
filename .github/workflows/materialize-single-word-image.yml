name: materialize-single-word-image

on:
  push:
    branches:
      - docs/single-original-png-test
    paths:
      - '.asset-upload/vcn/**'

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ hashFiles('.asset-upload/vcn/READY') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/single-original-png-test
      - name: Rebuild original PNG exactly
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p images/word-originals/oci
          cat .asset-upload/vcn/part-* | base64 -d > images/word-originals/oci/oci-vcn-create.png
          echo '5761f7425b7b145acf6ba94e7462cdde78dbaea8a1b901859daf4b33a0a26c0d  images/word-originals/oci/oci-vcn-create.png' | sha256sum -c -
      - name: Commit PNG and remove staging
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .asset-upload/vcn .github/workflows/materialize-single-word-image.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: add original Word OCI VCN screenshot'
          git push origin HEAD:docs/single-original-png-test
